crypttabOptions: luks
# /tmp: Debian 13 already mounts /tmp as tmpfs through systemd (tmp.mount), so the installer
# must not add a second /tmp line to fstab. Each entry MUST be a map: Calamares calls
# .get("tmpfs") on it when the root disk is an SSD (a plain string crashed the fstab job).
tmpOptions:
    default:
        tmpfs: false
    ssd:
        tmpfs: false
