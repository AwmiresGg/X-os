showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
requirements:
  requiredStorage: 20
  requiredRam: 2.0
  internetCheckUrl: https://deb.debian.org/debian/
  # Internet is not checked here: installing offline is fully supported (X-OS Setup offers
  # Wi-Fi before this, and browsers are downloaded on first boot if needed), so a missing
  # connection must not read as a failed requirement.
  check: [ storage, ram, power, root ]
  required: [ storage, ram, root ]
