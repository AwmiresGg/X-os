overwrite: false
# /etc/default/grub exists (build hook 16-grub-defaults); a grub.d file written by
# Calamares would be named 00calamares, which grub-mkconfig does not read.
prefer_grub_d: false
keep_distributor: false
defaults:
  GRUB_TIMEOUT: 5
  GRUB_DEFAULT: "saved"
  GRUB_DISABLE_SUBMENU: true
  GRUB_DISABLE_RECOVERY: false
  GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash"
  # Theme, menu colours and GRUB_DISTRIBUTOR: /etc/default/grub.d/10-xos.cfg
  # os-prober finds Windows and other systems so they stay bootable (dual boot).
  GRUB_DISABLE_OS_PROBER: false
