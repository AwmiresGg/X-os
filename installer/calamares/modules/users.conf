defaultGroups:
  - name: users
    must_exist: true
    system: true
  - sudo
  - netdev
  - bluetooth
  - audio
  - video
  - plugdev
  - lpadmin
sudoersGroup: sudo
setRootPassword: false
doAutologin: false
passwordRequirements:
  minLength: 6
  maxLength: -1
allowWeakPasswords: false
user:
  shell: /bin/bash
  forbidden_names: [ root, xos ]
