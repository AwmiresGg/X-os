# Runs inside the new system: language/keyboard defaults, then download the chosen
# browsers from their official signed repositories. Never fails the install: if the
# download fails (offline), xos-firstboot.service retries once the PC is online.
dontChroot: false
timeout: 1800
script:
  - command: "/usr/bin/xos-setup apply-target"
    timeout: 1800
  - "-systemctl enable xos-firstboot.service"
