<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- X-OS installer welcome mark: the logo on a soft accent glow, transparent around it
       so it sits on the installer page instead of reading as an empty picture frame. -->
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2BC4B0" stop-opacity=".20"/>
      <stop offset=".45" stop-color="#2BC4B0" stop-opacity=".06"/>
      <stop offset="1" stop-color="#2BC4B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FE6D8"/><stop offset=".5" stop-color="#2BC4B0"/><stop offset="1" stop-color="#17867A"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="320" cy="180" rx="240" ry="170" fill="url(#glow)"/>
  <g transform="translate(240 100) scale(1.25)">
    <circle cx="64" cy="64" r="58" fill="#121417"/>
    <circle cx="64" cy="64" r="57" fill="none" stroke="url(#a)" stroke-opacity=".5" stroke-width="2"/>
    <path d="M38 36c10 0 16 8 26 28s16 28 26 28" fill="none" stroke="url(#a)" stroke-width="13" stroke-linecap="round"/>
    <path d="M90 36c-10 0-16 8-21 18M59 74c-5 10-11 18-21 18" fill="none" stroke="url(#a)" stroke-width="13" stroke-linecap="round"/>
    <ellipse cx="64" cy="40" rx="34" ry="16" fill="url(#b)" opacity=".35"/>
  </g>
</svg>
