# X-OS installer (Calamares 3.3) - see installer/MODULE.md and documentation/SAFETY.md
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
  - id: xos-prepare
    module: shellprocess
    config: shellprocess_xos-prepare.conf
  - id: xos-apply
    module: shellprocess
    config: shellprocess_xos-apply.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@xos-prepare
      - packages
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess@xos-apply
      - umount
  - show:
      - finished

branding: xos
prompt-install: true          # final "Install now?" confirmation before any disk write
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
