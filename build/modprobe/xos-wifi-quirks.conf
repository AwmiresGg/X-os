# X-OS Wi-Fi quirks.
# Realtek RTL8821CE/RTL8822CE (rtw88): PCIe power saving (ASPM) and deep low-power state
# make scans return nothing or drop the link on many laptops (ASUS, HP, Lenovo). Only these
# Realtek chips are affected; other adapters ignore these options.
options rtw88_pci disable_aspm=1
options rtw88_core disable_lps_deep=1
