# X-OS boot menu defaults for installed systems (sourced by grub-mkconfig after
# /etc/default/grub). Kernel command line, timeout and default entry stay in
# /etc/default/grub, where the installer writes them.
GRUB_DISTRIBUTOR="X-OS"
GRUB_GFXMODE=auto
GRUB_THEME=/usr/share/grub/themes/xos/theme.txt
# Under Secure Boot, GRUB's lockdown refuses to load the theme's fonts and falls back to
# the text menu; these keep that menu in X-OS colours instead of the stock blue.
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="black/cyan"
