# X-OS build configuration. Sourced by build/build.sh.
# Every value can be overridden from the environment, e.g. XOS_VARIANT=desktop.

XOS_NAME="X-OS"
XOS_VERSION="${XOS_VERSION:-0.1.0-dev}"
XOS_CODENAME="${XOS_CODENAME:-genesis}"

# Debian base. trixie = Debian 13 (stable as of 2026).
XOS_SUITE="${XOS_SUITE:-trixie}"
XOS_MIRROR="${XOS_MIRROR:-http://deb.debian.org/debian}"
XOS_SECURITY_MIRROR="${XOS_SECURITY_MIRROR:-http://deb.debian.org/debian-security}"
XOS_COMPONENTS="main contrib non-free-firmware"
XOS_ARCH="amd64"

# Variant selects package lists:
#   core    - bootable base system, CLI only (fast VM boot verification)
#   desktop - core + KDE Plasma (Wayland) + X-OS shell, apps and tools
XOS_VARIANT="${XOS_VARIANT:-core}"

# Work and output directories (git-ignored, never outside the project tree).
XOS_WORK="${XOS_WORK:-$XOS_ROOT/build/work/$XOS_VARIANT}"
XOS_OUT="${XOS_OUT:-$XOS_ROOT/releases/out}"

# squashfs compression: xz is smallest, zstd decompresses fastest at boot.
XOS_SQUASHFS_COMP="${XOS_SQUASHFS_COMP:-zstd}"
XOS_SQUASHFS_OPTS="${XOS_SQUASHFS_OPTS:--Xcompression-level 19}"

# Live session user (created at boot by live-config; no password, sudo enabled).
XOS_LIVE_USER="xos"
XOS_HOSTNAME="x-os"
