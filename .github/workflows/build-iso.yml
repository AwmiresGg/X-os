name: build-iso
# Builds the X-OS desktop live ISO on a GitHub runner and attaches it to the run as a
# downloadable artifact (Actions tab -> this run -> Artifacts). Nothing is published elsewhere.
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "build/**"
      - "lib/**"
      - "bin/**"
      - "desktop/**"
      - "installer/**"
      - "icons/**"
      - "themes/**"
      - "ui/**"
      - "scripts/**"
      - "compatibility/**"
      - ".github/workflows/build-iso.yml"

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build tools
        run: sudo scripts/setup-build-host.sh

      - name: Unit tests
        run: scripts/run-tests.sh

      - name: Build desktop ISO
        env:
          XOS_VARIANT: desktop
          XOS_SQUASHFS_OPTS: "-Xcompression-level 6"
        run: sudo -E build/build.sh

      - name: Checksum
        run: |
          ls -lh releases/out/
          cat releases/out/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: x-os-desktop-iso
          path: |
            releases/out/*.iso
            releases/out/*.sha256
          compression-level: 0
          retention-days: 30
